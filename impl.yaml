project_name: "S.A.F.E.R (Smart Autonomous Facility Enforcement Robot)"
project_type: "hybrid"          # web | mobile | api | ml | hardware | iot | embedded | hybrid

impl_claim: >-
  A Raspberry Pi 5 on a Freenove 4WD chassis wanders an area on its own and
  steers away from obstacles closer than 35 cm, using an ultrasonic sensor.
  When the camera sees a person, the robot stops and runs a YOLOv8n PPE model
  (17 SH17 classes, ONNX through onnxruntime) on each frame. It flags a hard
  hat violation when a bare "head" box with no "helmet" box over it is seen in
  at least 5 of 10 consecutive frames. When a violation is confirmed, the
  robot sounds its buzzer, saves the frame as a JPEG plus JSON metadata (the
  detection boxes and the reason for the call) to an on-disk queue, and
  uploads it to a Flask/SQLite admin portal, which draws the boxes over the
  image. The portal lists every violation, and a reviewer marks each one
  confirmed or false positive. Those review flags are used to compute
  precision. If no head or helmet is visible, the robot makes no call.

languages: ["python"]
hardware_required: true         # the patrol needs the Pi 5, camera and Freenove chassis

setup:
  - "make install"
build:
  - "make compile"
test:
  - "make test"
run:
  - "make portal"

mock_mode:                      # how a grader runs it WITHOUT the hardware
  available: true
  commands:
    - "make mock"

demo:
  video: "https://drive.google.com/file/d/1LniFDaX6oen-bgjoeET2wxvGK0oPmdRs/view?usp=drive_link"
  screenshots: []

notes: >-
  Every command needs Python 3.10+ and GNU make (on Windows, use Git Bash),
  and "make install" needs network access. No credentials are needed; see
  .env.example for the optional portal settings. "make test" runs 130 unit
  tests, none of which need hardware. "make portal" serves the admin portal
  at http://127.0.0.1:5050 and seeds it with 24 synthetic violations.
  "make mock" runs the real vision, rules, tracker and patrol state machine
  code with three stand-ins: a simulated car (motors, servos, sonar, buzzer),
  a still image looped as the camera, and snapshots kept on disk instead of
  uploaded. The bundled image shows a worker wearing a hard hat, so the
  expected result is "helmet=PRESENT" and "violations found 0". Run
  "make mock MOCK_IMAGE=path/to/photo.jpg" with a photo of someone without
  a hard hat to see a violation saved to Code/Server/snapshots/pending/. The physical patrol runs on the
  Pi with "python Code/Server/ppe_main.py" and needs the robot hardware. It
  is shown in the demo videos; a second video (servo tracking and live PPE
  detection) is at
  https://drive.google.com/file/d/1PDEvJdE0BhoLxZ3X0HmEzh4dVs2YntvA/view?usp=sharing.
  There is no microcontroller firmware: the Pi drives the motors and servos
  directly through the kit's PCA9685 board, so nothing needs flashing. The
  vendored C library Code/Libs/rpi-ws281x-python (LED driver) builds only on
  a Raspberry Pi and is not part of grading. The ONNX models are already
  committed, so "make models" (optional, about a 2 GB download) is not
  needed.
